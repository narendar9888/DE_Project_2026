<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<rect width="1500" height="1050" fill="#ffffff"/>
<style>
.t{font: bold 19px Arial; fill:#102a43}.s{font:14px Arial;fill:#334e68}
.h{fill:#e8f1fb;stroke:#486581;stroke-width:2;rx:10}
.l{stroke:#627d98;stroke-width:2;fill:none}.r{font:13px Arial;fill:#486581}
</style>
<text x="750" y="42" text-anchor="middle" class="t" font-size="27">MakeMyTrip — Phase 2 ER Overview</text>
<path class="l" d="M250 155 L340 250"/><path class="l" d="M250 345 L340 250"/><path class="l" d="M250 605 L340 605"/><path class="l" d="M250 865 L650 845"/><path class="l" d="M520 865 L650 845"/><path class="l" d="M520 250 L930 275"/><path class="l" d="M830 845 L930 275"/><path class="l" d="M1110 275 L1190 195"/><path class="l" d="M250 605 L930 695"/><path class="l" d="M520 605 L930 695"/><path class="l" d="M830 845 L930 695"/><path class="l" d="M1110 695 L1190 765"/><rect class="h" x="70" y="110" width="250" height="90"/><text class="t" x="195" y="142" text-anchor="middle">AIRPORTS</text><text class="s" x="195" y="170" text-anchor="middle">PK iata_code</text><rect class="h" x="70" y="300" width="250" height="90"/><text class="t" x="195" y="332" text-anchor="middle">AIRLINES</text><text class="s" x="195" y="360" text-anchor="middle">PK airline_code</text><rect class="h" x="340" y="205" width="250" height="90"/><text class="t" x="465" y="237" text-anchor="middle">FLIGHTS</text><text class="s" x="465" y="265" text-anchor="middle">PK flight_id · FK airline_code, origin, destination</text><rect class="h" x="70" y="560" width="250" height="90"/><text class="t" x="195" y="592" text-anchor="middle">HOTELS</text><text class="s" x="195" y="620" text-anchor="middle">PK hotel_id · amenities JSONB</text><rect class="h" x="340" y="560" width="250" height="90"/><text class="t" x="465" y="592" text-anchor="middle">ROOM_TYPES</text><text class="s" x="465" y="620" text-anchor="middle">PK room_type_id · FK hotel_id</text><rect class="h" x="70" y="820" width="250" height="90"/><text class="t" x="195" y="852" text-anchor="middle">CUSTOMERS</text><text class="s" x="195" y="880" text-anchor="middle">PK customer_id</text><rect class="h" x="340" y="820" width="250" height="90"/><text class="t" x="465" y="852" text-anchor="middle">COUPONS</text><text class="s" x="465" y="880" text-anchor="middle">PK coupon_code</text><rect class="h" x="650" y="800" width="250" height="90"/><text class="t" x="775" y="832" text-anchor="middle">BOOKINGS</text><text class="s" x="775" y="860" text-anchor="middle">PK booking_id · UK booking_ref · FK customer_id, coupon_code</text><rect class="h" x="930" y="230" width="250" height="90"/><text class="t" x="1055" y="262" text-anchor="middle">FLIGHT_BOOKINGS</text><text class="s" x="1055" y="290" text-anchor="middle">PK/FK booking_id · FK flight_id</text><rect class="h" x="1190" y="150" width="250" height="90"/><text class="t" x="1315" y="182" text-anchor="middle">PASSENGERS</text><text class="s" x="1315" y="210" text-anchor="middle">PK booking_id + seq_no</text><rect class="h" x="930" y="650" width="250" height="90"/><text class="t" x="1055" y="682" text-anchor="middle">HOTEL_BOOKINGS</text><text class="s" x="1055" y="710" text-anchor="middle">PK/FK booking_id · FK hotel_id, room_type_id</text><rect class="h" x="1190" y="720" width="250" height="90"/><text class="t" x="1315" y="752" text-anchor="middle">HOTEL_REVIEWS</text><text class="s" x="1315" y="780" text-anchor="middle">PK review_id · FK booking_id + hotel_id</text><text x="750" y="1010" class="s" text-anchor="middle">Lines represent foreign-key relationships; bookings have one flight or hotel subtype (validated after load).</text></svg>